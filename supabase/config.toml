# Local Supabase project identifier only — NOT a hosted/cloud instance.
# This whole stack runs locally in Docker via `supabase start`.
# See README.md ("Supabase runs locally in Docker").
project_id = "illokcvaflhzrpxlwhtj"

[analytics]
enabled = false

# Auth & RBAC are enforced inside each Edge Function handler, allowing both
# user Bearer JWTs and internal service/cron tokens without gateway HS256 rejection.
[functions.process-import-chunk]
verify_jwt = false

[functions.process-scheduled-reports]
verify_jwt = false

[functions.send-email]
verify_jwt = false

[functions.send-sms]
verify_jwt = false