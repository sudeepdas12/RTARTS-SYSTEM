name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test & Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      CI: true
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: test-key-for-ci

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality & Linting (ESLint)
        run: npm run lint

      - name: TypeScript Strict Type Check
        run: npm run typecheck

      - name: Run Financial Test Suite (Vitest)
        run: npm run test:run -- --reporter=verbose

      - name: Verify Production Build
        run: npm run build

