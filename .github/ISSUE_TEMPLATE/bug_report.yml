name: 🐛 Bug Report
description: File a bug report for operations, calculations, or system workflows
title: [BUG]: 
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Please provide detailed information to help reproduce and resolve the issue.
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of the system is experiencing this issue?
      options:
        - Classification & Demographics
        - Dividend / Interest Calculation
        - Tax (TDS) Rules & Rates
        - Payment Batch & ConnectIPS Export
        - Bank Reconciliation Engine
        - Excel / Demat Import Engine
        - Reports & Tax Registers
        - Workflow & Approvals
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Specific steps or data input leading to the error.
      placeholder: |
        1. Navigate to '...'
        2. Upload Excel file with ...
        3. Observe calculation discrepancy
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen versus what actually happened?
    validations:
      required: true
