name: ✨ Feature Request
description: Suggest an improvement, new instrument type, or workflow enhancement
title: [FEATURE]: 
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature for the RTARTS System.
  - type: textarea
    id: feature_summary
    attributes:
      label: Feature Summary
      description: What feature or enhancement would you like to see?
    validations:
      required: true
  - type: textarea
    id: business_context
    attributes:
      label: Business Justification & Use Case
      description: How does this improve registrar operations, investor servicing, or compliance?
    validations:
      required: true
